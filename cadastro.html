<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Livre</title>

    <!-- Vinculação do CSS externo-->
     <link rel="stylesheet" href="./css/cadastro.css">

</head>
<body>

    <!-- Cabeçalho -->
    <headear class="header" id="home">
        
        <h1>Amazon Livre</h1>
        <nav class="nav-menu">
            <ul>
                <li><a href="./teste1.html">Home</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </headear>
    
    <main>

        <!-- Bannner -->
        <section class="banner" aria-label="Destaque principal">
            <h2>Cadastre-se aqui</h2>
            <p>Preencha corretamente os campos abaixo para prossegui com o cadastro do usuário.</p>
        </section>
        <br>
        
        <br>

        <!-- Formulário -->
         <section class="cadastro">
            <h1>Dados do Usuário</h1>
            <br>

            <form id="formulario">

                <fieldset class="dados">
                    <!-- Nome -->
                    <label for="Nome">Nome:</label>
                    <input type="text" id="nome" placeholder= "Digite seu nome">

                    <!-- Email -->
                    <label for="Email">Email:</label>
                    <input type="email" id="email" placeholder= "exemplo@gmail.com">
                    <!-- Senha -->
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" minlength="6"
                        placeholder="Digite sua senha">
                    
                    <!-- Idade -->
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" min="18" placeholder="insira sua idade"> 
                <button id="enviar" type="submit">Enviar</button> <!-- Botão de enviar -->
                </fieldset>

            </form>

            <p id="mensagem"></p>
         </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Minha Loja Online</p>
    </footer>

 
</body>

</html>
